<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facilita</title>
<style>
  body { font-family: Arial; max-width: 700px; margin: 15px auto; padding: 10px; background:#f4f4f4; }
  h1 { font-size: 22px; text-align:center; }
  textarea { width: 100%; height: 90px; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
  button { margin-top: 10px; padding: 14px; width: 100%; font-size: 16px; background: #111; color: #fff; border: none; border-radius: 8px; }
  button:disabled { background: #888; }
  .agent { margin-top: 15px; padding: 12px; background: #fff; border-radius: 8px; white-space: pre-wrap; }
  .nom { font-weight: bold; color: #111; display:block; margin-bottom:6px; font-size: 17px; }
</style>
</head>
<body>

<h1>Facilita</h1>

<textarea id="idee" placeholder="Écris ton idée ici..."></textarea>
<button id="btn" onclick="lancer()">Faire travailler l'équipe</button>

<div id="marketing" class="agent"></div>
<div id="consultant" class="agent"></div>
<div id="critique" class="agent"></div>

<script>
  // Nettoie le texte : enlève astérisques, dièses, tirets Markdown
  function nettoyer(texte) {
    if (!texte) return "";
    return texte
      .replace(/\*\*/g, "")
      .replace(/\*/g, "")
      .replace(/^#+\s*/gm, "")
      .replace(/^-\s+/gm, "• ")
      .trim();
  }

  async function appelerAgent(role, idee, contexte) {
    const reponse = await fetch("https://f-life-api.vercel.app/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ role, idee, contexte })
    });
    const data = await reponse.json();
    if (!data.choices) {
      return "ERREUR : " + JSON.stringify(data);
    }
    return nettoyer(data.choices[0].message.content);
  }

  async function lancer() {
    const idee = document.getElementById("idee").value.trim();
    if (!idee) return;

    const btn = document.getElementById("btn");
    btn.disabled = true;

    const m = document.getElementById("marketing");
    const c = document.getElementById("consultant");
    const k = document.getElementById("critique");

    m.textContent = ""; c.textContent = ""; k.textContent = "";

    try {
      // Rose — Directrice Marketing
      m.innerHTML = '<span class="nom">Rose — Directrice Marketing</span>Réflexion...';
      const rep1 = await appelerAgent(
        "Tu es Rose, directrice marketing expérimentée, spécialisée en Afrique centrale et en RDC (Lubumbashi, Kolwezi). Tu connais les réalités locales : prix en CDF et USD, habitudes des clients, canaux de vente (WhatsApp, bouche-à-oreille, Facebook, marchés). Tu maîtrises les services de nettoyage, entretien de meubles et tissus, ainsi que le trading. RÈGLES : Écris en texte simple, SANS astérisques, SANS dièses, SANS puces Markdown. Donne maximum 3 actions concrètes, avec des prix en CDF. Termine par une phrase de démarchage prête à envoyer à un client.",
        idee
      );
      m.innerHTML = '<span class="nom">Rose — Directrice Marketing</span>' + rep1;

      // Hugor — Consultant stratégie
      c.innerHTML = '<span class="nom">Hugor — Consultant stratégie</span>Réflexion...';
      const rep2 = await appelerAgent(
        "Tu es Hugor, consultant en stratégie, spécialisé en RDC et en Afrique centrale. Tu analyses la faisabilité d'un projet : coûts réels en CDF et USD, risques locaux (logistique, pouvoir d'achat, concurrence), cadre légal, et prochaines étapes concrètes. Pour le trading, tu insistes sur la gestion du risque et tu ne présentes jamais une stratégie comme une garantie de gain. RÈGLES : Écris en texte simple, SANS astérisques, SANS dièses, SANS puces Markdown. Donne des chiffres précis (coûts, délais, marges). Termine par UNE seule recommandation claire.",
        idee,
        "Marketing (Rose): " + rep1
      );
      c.innerHTML = '<span class="nom">Hugor — Consultant stratégie</span>' + rep2;

      // Orchidée — Critique
      k.innerHTML = '<span class="nom">Orchidée — Critique</span>Réflexion...';
      const rep3 = await appelerAgent(
        "Tu es Orchidée, critique sévère mais constructif. Tu trouves les faiblesses, les angles morts, les incohérences et ce qui peut faire échouer le projet. Tu tiens compte du contexte RDC (Lubumbashi, Kolwezi), des contraintes locales et des limites de l'entrepreneur débutant. RÈGLES : Écris en texte simple, SANS astérisques, SANS dièses, SANS puces Markdown. Donne maximum 3 faiblesses, et pour chacune, une correction concrète. Ne valide rien gratuitement.",
        idee,
        "Marketing (Rose): " + rep1 + "\n\nConsultant (Hugor): " + rep2
      );
      k.innerHTML = '<span class="nom">Orchidée — Critique</span>' + rep3;

    } catch (e) {
      m.textContent = "Erreur : " + e.message;
    }

    btn.disabled = false;
  }
</script>

</body>
</html>
